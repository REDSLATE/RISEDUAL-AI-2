[pytest]
# RISEDUAL test layout — fast / slow split.
#
# tests/        → fast suite (pure unit / static / mocked-IO).
#                 Default ``pytest`` discovers everything here and
#                 should stay under a few seconds wall-clock so the
#                 dev loop stays tight.
# tests/slow/   → slow suite (network-bound, real LLM calls, real
#                 broker sandboxes, anything that takes >2s on a warm
#                 cache). Default ``pytest`` SKIPS this directory; run
#                 it explicitly with ``pytest tests/slow``.
#
# A new test goes into tests/slow/ if ANY of:
#   * It hits the network (HTTPS preview URL, real broker, real LLM).
#   * It depends on real Mongo state across requests.
#   * It runs longer than ~2 seconds on a warm cache.
# Otherwise it goes into tests/ at the root.
testpaths = tests
norecursedirs = tests/slow .git node_modules build dist .pytest_cache
asyncio_mode = strict
