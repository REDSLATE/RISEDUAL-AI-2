[mypy]
# Pre-deploy type-check gate. Baseline-style: the `typecheck.sh` wrapper
# compares the current report against `scripts/typecheck_baseline.txt`
# and fails only when the error list changes (new errors, or errors that
# fixed themselves and shouldn't come back).
#
# Rationale for the settings below:
#   * `ignore_missing_imports` — third-party libs (motor, chromadb,
#     emergentintegrations, alpaca_trade_api, cryptography) ship without
#     stubs. Turning this off buries the real signal in ~2000 "Cannot
#     find stubs for ..." noise. Re-evaluate when py.typed becomes
#     universal (not 2026).
#   * `no_strict_optional` — the codebase mixes `Optional[X]` with raw
#     `None`-default params across ~10k LoC. `--strict-optional` would
#     flag every place a service reads an env-var with a fallback.
#   * `explicit_package_bases` — we have `search_war_room` importable
#     both as `search_war_room` and `services.search_war_room`. This
#     tells mypy to use `services/` as the package root.
#   * `follow_imports = silent` — don't cascade through every upstream
#     dep; only report errors in the files we're checking.
ignore_missing_imports = True
no_strict_optional = True
explicit_package_bases = True
follow_imports = silent
show_error_codes = True

# Per-file overrides (intentionally empty today — the baseline file is
# where regressions get caught, not here). Add entries as individual
# services harden their types.
